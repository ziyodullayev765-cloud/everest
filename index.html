<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVEREST No.1 — English Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#15192B;
  --paper-2:#1E2338;
  --ink:#F3F1E9;
  --ink-soft:#9AA1B8;
  --indigo:#4B4AC4;
  --indigo-deep:#38369A;
  --amber:#E8A33D;
  --amber-soft:#3A2E17;
  --teal:#2E9E82;
  --teal-soft:#122D26;
  --coral:#E4572E;
  --coral-soft:#3A1F16;
  --line:#2B3050;
  --card:#1B2036;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow: 0 1px 2px rgba(28,37,65,.04), 0 12px 28px -12px rgba(28,37,65,.16);
  --font-display:'Fraunces', serif;
  --font-body:'Manrope', sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:#07101f;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; margin:0;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
img,svg{display:block; max-width:100%;}
::selection{background:var(--amber-soft);}
a{color:inherit;}

.screen{display:none; min-height:100%;}
.screen.active{display:block;}

/* ============ LOGIN ============ */
#login-screen.active{
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh;
  padding:32px 20px;
  position:relative;
  isolation:isolate;
}
#login-screen.active::before{
  content:"";
  position:fixed; inset:0; z-index:-2;
  background-image:linear-gradient(180deg,rgba(5,13,29,.45),rgba(4,10,24,.85)),
                   url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=3840&auto=format&fit=crop');
  background-size:cover; background-position:center;
  filter:saturate(1.1) contrast(1.05);
}
.login-wrap{
  width:100%; max-width:920px; display:grid; grid-template-columns:1.1fr 1fr; gap:0; 
  background:rgba(18,28,59,.78); border-radius:32px; overflow:hidden; 
  box-shadow:0 24px 70px rgba(0,0,0,.45); border:1px solid rgba(177,207,255,.22);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
}
@media (max-width:760px){ .login-wrap{grid-template-columns:1fr;} .login-hero{display:none !important;} }

.login-hero{
  background:linear-gradient(160deg, rgba(37,99,235,.4) 0%, rgba(11,23,54,.8) 100%);
  color:#fff; padding:48px 40px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
}
.login-hero .mark{font-family:var(--font-display); font-size:22px; font-weight:600; display:flex; align-items:center; gap:8px;}
.login-hero .headline{font-size:clamp(28px,3.4vw,38px); line-height:1.12; margin-top:28px;}
.login-hero .headline em{font-style:italic; color:#60A5FA;}
.hero-decor{position:absolute; inset:0; opacity:.5; pointer-events:none;}
.login-hero .foot{font-size:13.5px; color:rgba(255,255,255,.72); line-height:1.5; margin-top:32px;}

.login-form-pane{padding:44px 40px;}
.login-form-pane .eyebrow{color:rgba(221,232,255,.64); font-size:14px;}
.login-form-pane h1{font-size:28px; margin-top:6px; color:#fff;}
.role-toggle{display:flex; background:rgba(255,255,255,.08); border-radius:100px; padding:4px; margin:26px 0 22px;}
.role-toggle button{flex:1; border:none; background:transparent; padding:10px 0; border-radius:100px; font-weight:700; font-size:14px; color:rgba(235,243,255,.6); transition:all .2s ease;}
.role-toggle button.active{background:#2563EB; color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:rgba(220,230,250,.7); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select, .field textarea{width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid rgba(160,190,235,.2); font-size:15.5px; font-family:var(--font-body); background:rgba(255,255,255,.06); color:#fff;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:#60A5FA;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:100px; padding:14px 22px; font-weight:700; font-size:15px; transition:transform .12s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#1D4ED8,#2563EB); color:#fff; width:100%; margin-top:6px; box-shadow:0 8px 18px rgba(37,99,235,.3);}
.btn-primary:hover{opacity:.9;}
.login-error{color:var(--coral); font-size:13.5px; margin-top:10px; min-height:16px;}
.demo-hint{margin-top:22px; padding:14px 16px; background:rgba(255,255,255,.06); border-radius:14px; font-size:12.5px; color:rgba(235,243,255,.7); line-height:1.6;}
.demo-hint b{color:#fff;}

/* ============ APP SHELL ============ */
#app-screen.active{
  position:relative;
  isolation:isolate;
  padding:16px;
  overflow:hidden;
  display:flex;
  min-height:100vh; min-height:100dvh;
}
#app-screen.active::before{
  content:"";
  position:fixed; inset:0; z-index:-2;
  background-image:linear-gradient(180deg,rgba(5,13,29,.45),rgba(4,10,24,.85)),
                   url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=3840&auto=format&fit=crop');
  background-size:cover; background-position:center top;
  filter:saturate(1.1) contrast(1.05);
}

.sidebar{
  width:270px; flex-shrink:0;
  height:calc(100vh - 32px); height:calc(100dvh - 32px);
  position:sticky; top:16px;
  padding:28px 18px 20px;
  border:1px solid rgba(210,228,255,.25); border-radius:30px;
  background:linear-gradient(180deg,rgba(80,107,166,.35),rgba(8,18,42,.62));
  backdrop-filter:blur(30px) saturate(150%); -webkit-backdrop-filter:blur(30px) saturate(150%);
  box-shadow:0 26px 80px rgba(0,0,0,.38);
  display:flex; flex-direction:column; gap:6px; z-index:10;
}
.sidebar .mark{font-family:var(--font-display); font-size:20px; font-weight:600; padding:0 12px 28px; display:flex; align-items:center; gap:9px; color:#fff;}
.sidebar .mark b{color:#73B3FF;}
.nav-item{display:flex; align-items:center; gap:11px; padding:12px 14px; border-radius:17px; color:rgba(239,246,255,.72); font-weight:600; font-size:14.5px; border:none; background:transparent; text-align:left; width:100%; transition:all .2s;}
.nav-item svg{width:20px;height:20px; flex-shrink:0;}
.nav-item.active{background:linear-gradient(135deg,rgba(91,143,255,.46),rgba(123,92,255,.18)); border:1px solid rgba(158,200,255,.32); color:#fff; box-shadow:0 14px 34px rgba(43,102,224,.24);}
.nav-item:hover{color:#fff; background:rgba(255,255,255,.08);}
.sidebar-foot{margin-top:auto; padding-top:18px; border-top:1px solid rgba(255,255,255,.12);}
.user-chip{display:flex; align-items:center; gap:10px; padding:12px; border-radius:20px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14);}
.avatar{width:38px;height:38px;border-radius:50%; background:linear-gradient(135deg,#79B8FF,#5D8FFF); color:#081127; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
.user-chip .u-name{font-size:13.5px; font-weight:700; color:#fff;}
.user-chip .u-role{font-size:11.5px; color:rgba(225,236,255,.58); text-transform:capitalize;}
.logout-btn{margin-top:10px; width:100%; text-align:left; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10); border-radius:16px; color:rgba(235,243,255,.7); font-size:13px; font-weight:600; padding:10px 12px; display:flex; align-items:center; gap:8px;}
.logout-btn:hover{color:#fff; background:rgba(255,255,255,.12);}

.main{flex:1; min-width:0; padding:26px 28px 50px; overflow:auto;}
@media (max-width:860px){
  .sidebar{position:fixed; left:10px; right:10px; bottom:10px; top:auto; width:auto; height:auto; flex-direction:row; align-items:center; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); z-index:50; justify-content:space-around; border-radius:24px;}
  .sidebar .mark, .sidebar-foot{display:none;}
  .nav-item{flex-direction:column; gap:4px; font-size:10.5px; padding:8px 6px; flex:1; text-align:center; justify-content:center;}
  .main{padding:16px 14px 100px; width:100%;}
}

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:16px; flex-wrap:wrap;}
.topbar h1{font-size:clamp(26px,3vw,36px); color:#fff;}
.topbar .sub{color:rgba(221,232,255,.64); font-size:14.5px; margin-top:4px;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:100px; font-size:12.5px; font-weight:700;}
.pill-group{background:rgba(89,141,255,.18); border:1px solid rgba(120,175,255,.25); color:#EAF3FF;}

/* ============ DASHBOARD PROGRESS ============ */
.progress-hero{
  background:linear-gradient(135deg,rgba(52,91,166,.46),rgba(27,37,83,.58));
  border:1px solid rgba(210,228,255,.22); border-radius:26px; padding:26px 28px; color:#fff; margin-bottom:28px;
  display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  position:relative; overflow:hidden; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}
.progress-hero .ph-text .greet{font-size:14.5px; color:rgba(224,235,255,.68); font-weight:600;}
.progress-hero .ph-text h2{font-size:clamp(20px,2.6vw,26px); margin-top:4px;}
.ring-wrap{position:relative; width:104px; height:104px; flex-shrink:0; z-index:1;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-label .n{font-size:22px; font-weight:800; font-family:var(--font-display); color:#fff;}
.ring-label .d{font-size:10px; color:rgba(255,255,255,.7); font-weight:700;}

/* ============ CARDS GRID ============ */
.hw-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px;}
.hw-card{
  background:linear-gradient(145deg,rgba(31,52,100,.64),rgba(11,23,53,.70));
  border:1px solid rgba(177,207,255,.22); border-radius:24px; padding:22px;
  cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  display:flex; flex-direction:column; gap:14px; position:relative;
  backdrop-filter:blur(26px); -webkit-backdrop-filter:blur(26px);
  box-shadow:0 20px 50px rgba(0,0,0,.3); color:#fff;
}
.hw-card:hover{transform:translateY(-3px); border-color:rgba(210,230,255,.4);}
.hw-card .icon-badge{width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;}
.hw-card .icon-badge svg{width:28px;height:28px;}
.hw-card h3{font-size:17.5px; line-height:1.25; color:#fff;}
.hw-card .hw-sub{font-size:13.5px; color:rgba(222,233,253,.68); margin-top:4px;}
.hw-card .hw-figure{font-family:var(--font-display); font-size:20px; font-weight:600; margin-top:2px; color:#fff;}
.status-tag{position:absolute; top:18px; right:18px; font-size:11px; font-weight:800; padding:4px 10px; border-radius:100px; display:flex; align-items:center; gap:5px;}
.status-tag .dot{width:6px;height:6px;border-radius:50%;}
.status-not{background:rgba(244,80,38,.2); color:#FF7C54;}
.status-not .dot{background:#FF7C54;}
.status-progress{background:rgba(245,184,45,.2); color:#F4C75B;}
.status-progress .dot{background:#F4C75B;}
.status-done{background:rgba(32,199,157,.2); color:#42D9B0;}
.status-done .dot{background:#42D9B0;}
.mini-bar{height:8px; background:rgba(255,255,255,.08); border-radius:100px; overflow:hidden; margin-top:4px;}
.mini-bar > div{height:100%; background:linear-gradient(90deg,#2563EB,#60A5FA); border-radius:100px; transition:width .3s ease;}
.hw-card .due{font-size:12px; color:rgba(220,232,255,.68); margin-top:auto; display:flex; align-items:center; gap:5px;}

/* ============ DETAIL PAGE & CONTENT ============ */
.detail-wrap{max-width:800px; background:rgba(18,28,59,.70); border:1px solid rgba(177,207,255,.22); border-radius:26px; padding:28px; backdrop-filter:blur(22px);}
.back-btn{display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; font-weight:700; font-size:14px; padding:8px 16px; border-radius:100px; margin-bottom:18px;}
.detail-head{display:flex; align-items:center; gap:16px; margin-bottom:20px;}
.detail-head .icon-badge{width:64px;height:64px;border-radius:20px;}
.detail-head h1{font-size:clamp(24px,3.4vw,32px); color:#fff;}
.detail-head .hw-figure{font-size:16px; color:rgba(220,232,255,.7); font-weight:700; margin-top:3px;}
.detail-block{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius-md); padding:22px 24px; margin-bottom:16px;}
.detail-block h4{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:#60A5FA; font-weight:800; margin-bottom:12px;}
.detail-block p, .detail-block li{font-size:15.5px; line-height:1.65; color:rgba(240,245,255,.9);}
.detail-block ol, .detail-block ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px;}

/* Custom Image & Audio Display */
.media-display-box{margin-top:14px; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.3); padding:12px;}
.media-display-box img{width:100%; max-height:450px; object-fit:contain; border-radius:10px; display:block;}
.media-display-box audio{width:100%; margin-top:10px;}

.word-row{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.08);}
.word-row:last-child{border-bottom:none;}
.word-row .wtext{flex:1; min-width:0;}
.word-row .w-en{font-weight:800; font-size:16px; color:#fff;}
.word-row .w-uz{font-size:13.5px; color:#60A5FA; font-weight:700;}
.word-row .w-ex{font-size:13px; color:rgba(220,230,250,.6); font-style:italic; margin-top:2px;}
.word-check{width:26px;height:26px; border-radius:8px; border:2px solid rgba(255,255,255,.2); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.word-check.checked{background:#2E9E82; border-color:#2E9E82;}
.word-check svg{width:15px;height:15px; opacity:0; color:#fff;}
.word-check.checked svg{opacity:1;}

.sent-item{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.08);}
.sent-item .num{color:#60A5FA; font-weight:800; font-size:13px; min-width:22px; padding-top:2px;}
.sent-item .txt{flex:1; font-size:15px; color:#fff;}
.add-sent-row{display:flex; gap:10px; margin-top:14px;}
.add-sent-row input{flex:1;}
.add-sent-row button{background:#2563EB; color:#fff; border:none; border-radius:12px; padding:0 20px; font-weight:700;}

/* ============ TEACHER PANEL ============ */
.teacher-card{background:rgba(18,28,59,.70); border:1px solid rgba(177,207,255,.22); border-radius:24px; padding:24px; backdrop-filter:blur(22px); margin-bottom:24px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:24px 0 16px; gap:12px;}
.section-title h2{font-size:20px; color:#fff;}
.btn-outline{background:transparent; border:1.5px solid #60A5FA; color:#60A5FA; padding:8px 18px; border-radius:100px; font-weight:700; font-size:13.5px;}
.btn-outline:hover{background:#60A5FA; color:#0B1736;}
.table-wrap{background:rgba(10,18,42,.6); border:1px solid rgba(255,255,255,.1); border-radius:18px; overflow:hidden;}
.t-row{display:grid; grid-template-columns:2fr 1fr 1.2fr auto; gap:10px; align-items:center; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px;}
.t-row.head{background:rgba(255,255,255,.05); font-weight:800; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:rgba(220,230,250,.6);}
.t-row:last-child{border-bottom:none;}
.icon-btn{background:rgba(255,255,255,.08); border:none; width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; color:#fff; margin-left:4px;}
.icon-btn:hover{background:rgba(255,255,255,.18);}
.icon-btn svg{width:16px;height:16px;}

/* Modal */
.modal-bg{position:fixed; inset:0; background:rgba(5,11,24,.75); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(6px);}
.modal-bg.active{display:flex;}
.modal{background:#151E3A; border:1px solid rgba(177,207,255,.25); border-radius:24px; padding:28px; width:100%; max-width:540px; max-height:90vh; overflow-y:auto; color:#fff; box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal h3{font-size:22px; margin-bottom:18px; color:#fff;}
.modal-actions{display:flex; gap:10px; margin-top:22px;}
.btn-ghost{background:rgba(255,255,255,.08); color:#fff; border:none; border-radius:100px; padding:12px 22px; font-weight:700; flex:1;}
.chip-check{padding:8px 14px; border-radius:100px; border:1.5px solid rgba(255,255,255,.15); font-size:12.5px; font-weight:700; background:rgba(255,255,255,.04); color:rgba(255,255,255,.7); cursor:pointer;}
.chip-check.on{background:#2563EB; color:#fff; border-color:#2563EB;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#2563EB; color:#fff; padding:12px 24px; border-radius:100px; font-size:14px; font-weight:700; opacity:0; transition:all .25s ease; z-index:200; pointer-events:none; box-shadow:0 10px 25px rgba(0,0,0,.3);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen" class="screen active">
  <div class="login-wrap">
    <div class="login-hero">
      <div class="mark">
        <span class="everest-logo-mini"><svg viewBox="0 0 48 38" width="32" height="28"><path d="M2 34 16 11l7 11 6-9 17 21H2Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></span>
        EVEREST <b style="color:#60A5FA;">No.1</b>
      </div>
      <div>
        <div class="headline">Your homework,<br>made <em>obvious</em>.</div>
        <p style="margin-top:14px; color:rgba(255,255,255,.75); font-size:15px; line-height:1.6;">High-resolution learning platform. Manage assignments, audio, and visual study tools in one place.</p>
      </div>
      <div class="foot">Built for Group A · Group B · Even-Day · Odd-Day students</div>
    </div>
    <div class="login-form-pane">
      <div class="eyebrow">Welcome back</div>
      <h1>Sign in to continue</h1>
      <div class="role-toggle">
        <button type="button" class="active" data-role="student" onclick="setLoginRole('student')">Student</button>
        <button type="button" data-role="teacher" onclick="setLoginRole('teacher')">Teacher</button>
      </div>
      <div class="field">
        <label>Username (25 logins active)</label>
        <select id="login-username" style="cursor:pointer;"></select>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="login-password" type="password" value="123456" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="handleLogin()">Sign in</button>
      <div class="login-error" id="login-error"></div>
      <div class="demo-hint" id="demo-hint">
        <b>Default Password:</b> 123456 for all accounts.
      </div>
    </div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="app-screen" class="screen">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main-content"></main>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'everest_hw_8k_v2';

let DB = null;
function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ DB = JSON.parse(raw); }
    else { DB = defaultData(); saveDB(); }
  }catch(e){ DB = defaultData(); }
}
function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){}
}

let SESSION = null;
let currentView = 'dashboard';
let currentHwId = null;

function populateLoginDropdown(role){
  const sel = document.getElementById('login-username');
  sel.innerHTML = '';
  const filtered = DB.users.filter(u => u.role === role);
  filtered.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.username;
    opt.textContent = `${u.name} (${u.username})`;
    sel.appendChild(opt);
  });
}

function setLoginRole(role){
  document.querySelectorAll('.role-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
  document.getElementById('login-username').dataset.role = role;
  populateLoginDropdown(role);
}

function handleLogin(){
  const role = document.getElementById('login-username').dataset.role || 'student';
  const uname = document.getElementById('login-username').value;
  const pass = document.getElementById('login-password').value;
  const user = DB.users.find(u => u.username===uname && u.password===pass && u.role===role);
  const err = document.getElementById('login-error');
  if(!user){ err.textContent = 'Parol noto\'g\'ri!'; return; }
  err.textContent = '';
  SESSION = {userId:user.id, role:user.role};
  try{ sessionStorage.setItem('everest_session', JSON.stringify(SESSION)); }catch(e){}
  enterApp();
}

function handleLogout(){
  SESSION = null;
  try{ sessionStorage.removeItem('everest_session'); }catch(e){}
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
}

function currentUser(){ return DB.users.find(u=>u.id===SESSION.userId); }

function enterApp(){
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  currentView = SESSION.role==='teacher' ? 'teacher-home' : 'dashboard';
  renderSidebar();
  renderMain();
}

function renderSidebar(){
  const user = currentUser();
  const initials = user.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const sb = document.getElementById('sidebar');
  let navItems = user.role==='student' ? 
    [['dashboard','home','Homework'],['progress','chart','Progress']] :
    [['teacher-home','home','Teacher Panel'],['teacher-progress','chart','Class Progress']];

  sb.innerHTML = `
    <div class="mark">
      <span class="everest-logo-mini"><svg viewBox="0 0 48 38" width="30" height="26"><path d="M2 34 16 11l7 11 6-9 17 21H2Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></span>
      <span>EVEREST <b>No.1</b></span>
    </div>
    ${navItems.map(([id,icon,label])=>`
      <button class="nav-item ${currentView===id?'active':''}" onclick="navigate('${id}')">
        ${ICONS[icon]}<span>${label}</span>
      </button>
    `).join('')}
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar">${initials}</div>
        <div>
          <div class="u-name">${user.name}</div>
          <div class="u-role">${user.role} ${user.group ? '• '+user.group : ''}</div>
        </div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">${ICONS.logout} Sign out</button>
    </div>
  `;
}

function navigate(view, hwId){
  currentView = view;
  currentHwId = hwId || null;
  renderSidebar();
  renderMain();
  window.scrollTo(0,0);
}

function renderMain(){
  const el = document.getElementById('main-content');
  if(currentView==='dashboard') el.innerHTML = renderStudentDashboard();
  else if(currentView==='detail') el.innerHTML = renderDetailPage(currentHwId);
  else if(currentView==='progress') el.innerHTML = renderStudentProgress();
  else if(currentView==='teacher-home') el.innerHTML = renderTeacherHome();
  else if(currentView==='teacher-progress') el.innerHTML = renderTeacherProgress();
}

/* ================= STUDENT DASHBOARD ================= */
function getProgress(userId, hwId){
  DB.progress[userId] = DB.progress[userId] || {};
  return DB.progress[userId][hwId] || {status:'not-started'};
}

function setProgress(userId, hwId, patch){
  DB.progress[userId] = DB.progress[userId] || {};
  DB.progress[userId][hwId] = Object.assign({}, DB.progress[userId][hwId]||{}, patch);
  saveDB();
}

function renderStudentDashboard(){
  const user = currentUser();
  const hws = DB.homeworks.filter(hw => hw.groups.includes(user.group));
  const completed = hws.filter(hw => (getProgress(user.id, hw.id).status==='done')).length;
  const pct = hws.length ? Math.round((completed/hws.length)*100) : 0;

  return `
    <div class="topbar">
      <div>
        <h1>Welcome, ${user.name}</h1>
        <div class="sub">Group: ${user.group}</div>
      </div>
      <span class="pill pill-group">EVEREST 8K SYSTEM</span>
    </div>

    <div class="progress-hero">
      <div class="ph-text">
        <div class="greet">Your Overall Progress</div>
        <h2>${completed} of ${hws.length} Homework Completed</h2>
      </div>
      <div class="ring-wrap">
        <svg width="104" height="104">
          <circle cx="52" cy="52" r="42" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
          <circle cx="52" cy="52" r="42" fill="none" stroke="#60A5FA" stroke-width="8" 
                  stroke-dasharray="263" stroke-dashoffset="${263 - (263*pct)/100}"/>
        </svg>
        <div class="ring-label">
          <span class="n">${pct}%</span>
          <span class="d">DONE</span>
        </div>
      </div>
    </div>

    <div class="hw-grid">
      ${hws.map(hw => {
        const p = getProgress(user.id, hw.id);
        const isDone = p.status === 'done';
        return `
          <div class="hw-card" onclick="navigate('detail', '${hw.id}')">
            <div class="status-tag ${isDone?'status-done':'status-not'}">
              <span class="dot"></span> ${isDone?'Completed':'Pending'}
            </div>
            ${iconBadge(hw.icon)}
            <h3>${hw.title}</h3>
            <div class="hw-sub">${hw.sub}</div>
            <div class="hw-figure">${hw.figure}</div>
            <div class="mini-bar"><div style="width:${isDone?100:0}%"></div></div>
            <div class="due">Due: ${hw.due}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderDetailPage(hwId){
  const user = currentUser();
  const hw = DB.homeworks.find(h=>h.id===hwId);
  const p = getProgress(user.id, hwId);
  const isDone = p.status === 'done';

  return `
    <div class="detail-wrap">
      <button class="back-btn" onclick="navigate('dashboard')">← Back to Homework</button>
      <div class="detail-head">
        ${iconBadge(hw.icon)}
        <div>
          <h1>${hw.title}</h1>
          <div class="hw-figure">${hw.figure}</div>
        </div>
      </div>

      <div class="detail-block">
        <h4>Task Instructions</h4>
        <p>${hw.whatToDo}</p>
        <ul>
          ${hw.instructions.map(i=>`<li>${i}</li>`).join('')}
        </ul>
      </div>

      ${(hw.imgUrl || hw.audioUrl) ? `
        <div class="detail-block">
          <h4>Essential Visual & Audio Resources</h4>
          <div class="media-display-box">
            ${hw.imgUrl ? `<img src="${hw.imgUrl}" alt="Essential Material 8K">` : ''}
            ${hw.audioUrl ? `<audio controls src="${hw.audioUrl}"></audio>` : ''}
          </div>
        </div>
      ` : ''}

      <div class="detail-block" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <span style="font-weight:700;">Status:</span> ${isDone ? '<span style="color:#42D9B0;">Completed</span>' : '<span style="color:#FF7C54;">Not Submitted</span>'}
        </div>
        <button class="btn btn-primary" style="width:auto;" onclick="toggleTaskDone('${hw.id}')">
          ${isDone ? 'Mark as Undone' : 'Mark Task as Completed'}
        </button>
      </div>
    </div>
  `;
}

function toggleTaskDone(hwId){
  const user = currentUser();
  const p = getProgress(user.id, hwId);
  const newStatus = p.status === 'done' ? 'not-started' : 'done';
  setProgress(user.id, hwId, {status: newStatus});
  showToast(newStatus === 'done' ? 'Homework Marked as Completed!' : 'Homework Marked as Pending');
  renderMain();
}

function renderStudentProgress(){
  const user = currentUser();
  const hws = DB.homeworks.filter(hw => hw.groups.includes(user.group));
  return `
    <div class="topbar"><h1>My Progress History</h1></div>
    <div class="teacher-card">
      ${hws.map(hw => {
        const p = getProgress(user.id, hw.id);
        return `
          <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.1);">
            <div><strong>${hw.title}</strong><br><small style="color:rgba(255,255,255,.6);">${hw.due}</small></div>
            <div style="font-weight:700; color:${p.status==='done'?'#42D9B0':'#FF7C54'}">${p.status==='done'?'Completed':'Incomplete'}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function openEditHwModal(hwId){
  const hw = DB.homeworks.find(h=>h.id===hwId);

}

function openHwModal(hw = null){
  const isEdit = !!hw;
  const m = document.getElementById('modal-body');
  m.innerHTML = `
    <h3>${isEdit ? 'Edit Homework' : 'Add New Homework'}</h3>
    <div class="field">
      <label>Homework Title</label>
      <input id="hw-title" type="text" value="${isEdit?hw.title:''}" placeholder="e.g. Essential 2 Grammar">
    </div>
    <div class="field">
      <label>Sub-figure / Chapter Info</label>
      <input id="hw-figure" type="text" value="${isEdit?hw.figure:''}" placeholder="e.g. Unit 25 - 26">
    </div>
    <div class="field">
      <label>Target Groups</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
        ${DB.groups.map(g => {
          const sel = isEdit ? hw.groups.includes(g) : true;
          return `<span class="chip-check ${sel?'on':''}" onclick="this.classList.toggle('on')">${g}</span>`;
        }).join('')}
      </div>
    </div>
    <div class="field">
      <label>Essential Image Upload (URL or Base64)</label>
      <input id="hw-img" type="text" value="${isEdit?(hw.imgUrl||''):''}" placeholder="Paste Image Link or Base64">
      <input type="file" accept="image/*" style="margin-top:6px; font-size:12px;" onchange="handleFileUpload(this, 'hw-img')">
    </div>
    <div class="field">
      <label>Audio Practice File (URL or Base64)</label>
      <input id="hw-audio" type="text" value="${isEdit?(hw.audioUrl||''):''}" placeholder="Paste MP3 Link or Base64">
      <input type="file" accept="audio/*" style="margin-top:6px; font-size:12px;" onchange="handleFileUpload(this, 'hw-audio')">
    </div>
    <div class="field">
      <label>Instructions & Description</label>
      <textarea id="hw-desc" placeholder="Write instructions...">${isEdit?hw.whatToDo:''}</textarea>
    </div>
    <div class="field">
      <label>Due Date</label>
      <input id="hw-due" type="date" value="${isEdit?hw.due:'2026-09-30'}">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="width:auto;" onclick="saveHw('${isEdit?hw.id:''}')">Save Homework</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('active');
}

function handleFileUpload(inputEl, targetId){
  const file = inputEl.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      document.getElementById(targetId).value = e.target.result;
      showToast('File loaded successfully!');
    };
    reader.readAsDataURL(file);
  }
}

function closeModal(){
  document.getElementById('modal-bg').classList.remove('active');
}

function saveHw(hwId){
  const title = document.getElementById('hw-title').value;
  const figure = document.getElementById('hw-figure').value;
  const imgUrl = document.getElementById('hw-img').value;
  const audioUrl = document.getElementById('hw-audio').value;
  const desc = document.getElementById('hw-desc').value;
  const due = document.getElementById('hw-due').value;
  
  const selectedGroups = [];
  document.querySelectorAll('.chip-check.on').forEach(c => selectedGroups.push(c.textContent.trim()));

  if(!title){ showToast('Please enter a title!'); return; }

  if(hwId){
    const hw = DB.homeworks.find(h=>h.id===hwId);
    hw.title = title; hw.figure = figure; hw.imgUrl = imgUrl; hw.audioUrl = audioUrl;
    hw.whatToDo = desc; hw.due = due; hw.groups = selectedGroups;
  } else {
    DB.homeworks.push({
      id: 'hw_' + Date.now(),
      type: 'essential2',
      icon: 'book',
      title: title,
      figure: figure,
      sub: 'Uploaded Homework',
      due: due,
      groups: selectedGroups,
      whatToDo: desc,
      instructions: ['Read instructions carefully.'],
      imgUrl: imgUrl,
      audioUrl: audioUrl
    });
  }
  saveDB();
  closeModal();
  showToast('Homework Saved!');
  renderMain();
}

function deleteHw(hwId){
  if(confirm('Delete this homework assignment?')){
    DB.homeworks = DB.homeworks.filter(h=>h.id!==hwId);
    saveDB();
    showToast('Homework Deleted!');
    renderMain();
  }
}

  const students = DB.users.filter(u=>u.role==='student');
  return `
    <div class="topbar"><h1>Students Overall Class Progress</h1></div>
    <div class="table-wrap">
      <div class="t-row head">
        <div>Student Name</div>
        <div>Group</div>
        <div>Completed Homeworks</div>
      </div>
      ${students.map(s => {
        const sHws = DB.homeworks.filter(hw => hw.groups.includes(s.group));
        const doneCount = sHws.filter(hw => getProgress(s.id, hw.id).status==='done').length;
        return `
          <div class="t-row">
            <div><strong>${s.name}</strong> (${s.username})</div>
            <div>${s.group}</div>
            <div><strong style="color:#60A5FA;">${doneCount}</strong> /${sHws.length} completed</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}

// Initial Boot
loadDB();
if(tryRestoreSession()){
  enterApp();
} else {
  populateLoginDropdown('student');
}

function tryRestoreSession(){
  try{
    const raw = sessionStorage.getItem('everest_session');
    if(raw){ SESSION = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}
</script>
