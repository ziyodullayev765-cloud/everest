/* ================= LIQUID GLASS DESIGN SYSTEM ================= */

  --bg-deep: #050B18;

/* ================= INDEXEDDB STORAGE (PERSISTENCE) ================= */
let dbInstance = null;
function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open("EverestHomeworkDB", 2);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("store")) {
        db.createObjectStore("store");
      }
    };
    req.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve();
    };
    req.onerror = () => resolve();
  });
}

function saveDB() {
  if (!dbInstance) return;
  const tx = dbInstance.transaction("store", "readwrite");
  const store = tx.objectStore("store");
  store.put(DB, STORE_KEY);
}

function loadDB() {
  return new Promise((resolve) => {
    if (!dbInstance) { DB = defaultData(); return resolve(); }
    const tx = dbInstance.transaction("store", "readonly");
    const store = tx.objectStore("store");
    const req = store.get(STORE_KEY);
    req.onsuccess = () => {
      DB = req.result || defaultData();
      resolve();
    };
    req.onerror = () => {
      DB = defaultData();
      resolve();
    };
  });
}

  document.getElementById('btn-role-student').classList.toggle('active', role === 'student');
  document.getElementById('btn-role-teacher').classList.toggle('active', role === 'teacher');
  document.getElementById('login-username').dataset.role = role;
  populateLoginDropdown(role);
}

function handleLogin(){
  const role = document.getElementById('login-username').dataset.role || 'student';
  const uname = document.getElementById('login-username').value;
  const pass = document.getElementById('login-password').value;
  const user = DB.users.find(u => u.username===uname && u.password===pass && u.role===role);
  if(!user){ document.getElementById('login-error').textContent = 'Invalid credentials!'; return; }
  SESSION = {userId:user.id, role:user.role};
  try{ localStorage.setItem('everest_session', JSON.stringify(SESSION)); }catch(e){}
  enterApp();
}

function handleLogout(){
  SESSION = null;
  try{ localStorage.removeItem('everest_session'); }catch(e){}
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
}

function currentUser(){ return DB.users.find(u=>u.id===SESSION.userId); }

function enterApp(){
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  currentView = SESSION.role==='teacher' ? 'teacher-home' : 'dashboard';
  renderSidebar();
  renderMobileNav();
  renderMain();
}

function renderMobileNav(){
  const user = currentUser();
  const nav = document.getElementById('mobile-nav');
  if(user.role !== 'student') { nav.style.display = 'none'; return; }
  nav.style.display = 'flex';
  const items = [['dashboard','home','Home'],['homeworks','book','Homework'],['progress','chart','Progress'],['profile','user','Profile']];
  nav.innerHTML = items.map(([id,icon,label])=>`
    <button class="${currentView===id?'active':''}" onclick="navigate('${id}')">

function navigate(view, hwId){
  currentView = view;
  currentHwId = hwId || null;

  renderMobileNav();

function renderMain(){
  const el = document.getElementById('main-content');

  else if(currentView==='homeworks') el.innerHTML = renderHomeworksList();
  else if(currentView==='detail') el.innerHTML = renderDetailPage(currentHwId);
  else if(currentView==='progress') el.innerHTML = renderStudentProgress();
  else if(currentView==='achievements') el.innerHTML = renderAchievements();
  else if(currentView==='notifications') el.innerHTML = renderNotifications();
  else if(currentView==='profile') el.innerHTML = renderProfilePage();
  else if(currentView==='settings') el.innerHTML = renderSettingsPage();
  else if(currentView==='teacher-home') el.innerHTML = renderTeacherHome();
  else if(currentView==='teacher-progress') el.innerHTML = renderTeacherProgress();
}

  DB.progress[userId] = DB.progress[userId] || {};

function submitHomework(hwId){
  const user = currentUser();
  setProgress(user.id, hwId, {submitted: true});
  user.points = (user.points || 0) + 10;
  saveDB();
  showToast('✓ Submitted successfully! (+10 pts)');
  renderMain();
}

function toggleTaskDone(hwId){
  const user = currentUser();
  const p = getProgress(user.id, hwId);
  const nextState = p.status === 'done' ? 'in-progress' : 'done';
  if(nextState === 'done') user.points = (user.points || 0) + 50;
  setProgress(user.id, hwId, {status: nextState});
  saveDB();
  showToast(nextState === 'done' ? 'Task Completed! (+50 pts)' : 'Task Status Updated');
  renderMain();
}

function saveHw(hwId){
  const category = document.getElementById('hw-cat').value;
  const title = document.getElementById('hw-title').value;
  const figure = document.getElementById('hw-figure').value;
  const desc = document.getElementById('hw-desc').value;
  const due = document.getElementById('hw-due').value;

  if(!title){ showToast('Please enter title'); return; }

  if(hwId){
    const hw = DB.homeworks.find(h=>h.id===hwId);
    Object.assign(hw, {category, title, figure, whatToDo:desc, due});
  } else {
    DB.homeworks.push({ id:'hw_'+Date.now(), category, title, figure, due, whatToDo:desc, images:[] });
  }
  saveDB(); closeModal(); showToast('Saved Successfully!'); renderMain();
}

function deleteHw(hwId){
  if(confirm('Delete assignment?')){
    DB.homeworks = DB.homeworks.filter(h=>h.id!==hwId);
    saveDB(); renderMain();
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function tryRestoreSession(){
  try{
    const raw = localStorage.getItem('everest_session');
    if(raw){ SESSION = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}

// INITIALIZATION
initDB().then(async () => {
  await loadDB();
  if(tryRestoreSession()) enterApp();
  else populateLoginDropdown('student');
});
</script>
