<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EVEREST SaaS — Advanced Homework Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= LIQUID NAVY GLASSMORPHISM ================= */
:root {
  --bg-deep: #030712;
  --glass-card: rgba(15, 23, 42, 0.65);
  --glass-card-hover: rgba(30, 41, 59, 0.8);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-border-glow: rgba(96, 165, 250, 0.4);
  --accent-blue: #3B82F6;
  --accent-blue-hover: #2563EB;
  --accent-cyan: #06B6D4;
  --accent-amber: #F59E0B;
  --accent-emerald: #10B981;
  --accent-rose: #EF4444;
  --text-main: #F8FAFC;
  --text-muted: #94A3B8;
  --font-heading: 'Outfit', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
  --sidebar-width: 270px;
  --sidebar-collapsed-width: 80px;
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

/* ANTI-ZOOM & SELECTION BUG FIX */
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  touch-action: manipulation; 
  -webkit-tap-highlight-color: transparent;
}

body, button, .nav-btn, .stat-card, .sidebar, .mobile-nav, .brand-title, .t-card, .hw-card {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

input, textarea, select {
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
}

html, body { 
  height: 100%; 
  font-family: var(--font-body); 
  background: var(--bg-deep); 
  color: var(--text-main); 
  -webkit-font-smoothing: antialiased; 
  overflow-x: hidden; 
}

button { font-family: var(--font-body); cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: var(--font-body); }

/* BACKGROUND ATMOSPHERE */
.app-bg {
  position: fixed; inset: 0; z-index: -1;
  background-image: 
    radial-gradient(circle at 10% 0%, rgba(59, 130, 246, 0.25) 0%, transparent 45%),
    radial-gradient(circle at 90% 100%, rgba(6, 182, 212, 0.2) 0%, transparent 45%),
    linear-gradient(180deg, rgba(3, 7, 18, 0.85) 0%, rgba(3, 7, 18, 0.98) 100%),
    url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=3840&auto=format&fit=crop');
  background-size: cover; background-position: center; filter: saturate(1.1);
}

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; }

/* GLASS PANELS */
.glass-panel {
  background: var(--glass-card);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border-radius: var(--radius-lg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ================= LOGIN SCREEN ================= */
#login-screen { display: none; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
#login-screen.active { display: flex; }
.login-box { width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--radius-xl); overflow: hidden; }
@media (max-width: 768px) { .login-box { grid-template-columns: 1fr; } .login-hero { display: none; } }

.login-hero { padding: 48px; background: linear-gradient(135deg, rgba(37, 99, 235, 0.35), rgba(6, 182, 212, 0.15)); display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--glass-border); }
.brand-title { font-family: var(--font-heading); font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: -0.02em; }
.brand-tagline { font-size: 11px; letter-spacing: 0.15em; color: var(--accent-cyan); text-transform: uppercase; font-weight: 800; margin-top: 4px; }

.login-form-pane { padding: 48px; }
.role-tabs { display: flex; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 100px; margin: 20px 0; border: 1px solid var(--glass-border); }
.role-tabs button { flex: 1; padding: 10px; border-radius: 100px; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 13px; transition: 0.2s; }
.role-tabs button.active { background: var(--accent-blue); color: #fff; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.5); }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; }
.field input, .field select, .field textarea { width: 100%; padding: 12px 16px; background: rgba(3, 7, 18, 0.6); border: 1px solid var(--glass-border); border-radius: var(--radius-md); color: #fff; font-size: 14px; transition: all 0.2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-blue); outline: none; box-shadow: 0 0 16px rgba(59, 130, 246, 0.35); background: rgba(3, 7, 18, 0.8); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 100px; font-weight: 700; font-size: 14px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, var(--accent-blue), #1D4ED8); color: #fff; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
.btn-primary:hover { opacity: 0.95; box-shadow: 0 8px 25px rgba(37, 99, 235, 0.55); }
.btn-secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--glass-border); }
.btn-secondary:hover { background: rgba(255,255,255,0.15); }
.btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--accent-rose); border: 1px solid rgba(239, 68, 68, 0.4); }
.btn-danger:hover { background: rgba(239, 68, 68, 0.35); }

/* ================= MAIN LAYOUT ================= */
#app-screen { width: 100%; min-height: 100vh; display: flex; }
.sidebar { 
  width: var(--sidebar-width); 
  flex-shrink: 0; 
  padding: 24px 16px; 
  display: flex; 
  flex-direction: column; 
  gap: 6px; 
  height: 100vh; 
  position: sticky; 
  top: 0; 
  z-index: 20; 
  border-radius: 0 var(--radius-xl) var(--radius-xl) 0; 
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.sidebar.collapsed { width: var(--sidebar-collapsed-width); }
.sidebar.collapsed .brand-text, 
.sidebar.collapsed .nav-btn span, 
.sidebar.collapsed .sidebar-user-info, 
.sidebar.collapsed .brand-tagline { display: none; }
.sidebar.collapsed .sidebar-user { justify-content: center; padding: 8px; }

.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 20px 8px; border-bottom: 1px solid var(--glass-border); margin-bottom: 12px; }
.collapse-btn { background: rgba(255,255,255,0.06); color: var(--text-muted); border-radius: var(--radius-sm); padding: 6px; border: 1px solid var(--glass-border); }
.collapse-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }

.nav-btn { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--radius-md); color: var(--text-muted); font-weight: 600; font-size: 14px; background: transparent; width: 100%; text-align: left; transition: all 0.2s; }
.nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.nav-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
.nav-btn.active { background: linear-gradient(135deg, rgba(59, 130, 246, 0.35), rgba(6, 182, 212, 0.15)); border: 1px solid rgba(96, 165, 250, 0.4); color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

/* USER BAR & SIGN OUT */
.sidebar-user { margin-top: auto; padding: 10px 12px; display: flex; align-items: center; gap: 12px; border-radius: var(--radius-md); background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); }
.avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-blue); box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); display: flex; align-items: center; justify-content: center; background: var(--accent-blue); color: #fff; font-weight: 800; font-size: 14px; flex-shrink: 0; }
.logout-icon-btn { background: transparent; color: var(--accent-rose); padding: 8px; border-radius: 8px; transition: 0.2s; opacity: 0.8; }
.logout-icon-btn:hover { background: rgba(239, 68, 68, 0.2); opacity: 1; }

.main-viewport { flex: 1; padding: 28px 36px; overflow-y: auto; max-width: 1440px; margin: 0 auto; width: 100%; }

/* TOP BAR (SEARCH & NOTIFS) */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
.search-box { position: relative; width: 100%; max-width: 380px; }
.search-box input { width: 100%; padding: 12px 16px 12px 42px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 100px; color: #fff; font-size: 13.5px; }
.search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted); }

/* MOBILE BOTTOM NAV */
.mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(24px) saturate(160%); border-top: 1px solid var(--glass-border); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); z-index: 100; justify-content: space-around; }
.mobile-nav button { background: transparent; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; transition: 0.2s; }
.mobile-nav button.active { color: var(--accent-blue); }

@media (max-width: 880px) {
  .sidebar { display: none; }
  .mobile-nav { display: flex; }
  .main-viewport { padding: 20px 16px 100px 16px; }
  .top-bar { flex-direction: column; align-items: stretch; }
  .search-box { max-width: 100%; }
}

/* ================= DASHBOARD & CARDS ================= */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card { padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.stat-card-top { display: flex; justify-content: space-between; align-items: center; }
.stat-icon { width: 42px; height: 42px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); }
.stat-val { font-size: 28px; font-weight: 800; font-family: var(--font-heading); line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }

.quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 32px; }
.action-card { padding: 18px; border-radius: var(--radius-md); background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.2s; }
.action-card:hover { transform: translateY(-3px); background: rgba(59, 130, 246, 0.15); border-color: var(--accent-blue); }

.section-title { font-size: 20px; font-family: var(--font-heading); font-weight: 800; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; }

/* TABLES & LISTS */
.data-table-container { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--glass-border); }
.data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
.data-table th { background: rgba(255,255,255,0.04); padding: 14px 18px; color: var(--text-muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--glass-border); }
.data-table td { padding: 16px 18px; border-bottom: 1px solid var(--glass-border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(255,255,255,0.02); }

/* BADGES & PROGRESS */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 100px; text-transform: uppercase; }
.badge-done { background: rgba(16, 185, 129, 0.2); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.4); }
.badge-progress { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.4); }
.badge-none { background: rgba(239, 68, 68, 0.2); color: var(--accent-rose); border: 1px solid rgba(239, 68, 68, 0.4); }

.progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 100px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan)); border-radius: 100px; }

/* MODALS & TOAST */
.modal-overlay { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal-box { width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; padding: 32px; border-color: var(--glass-border-glow); }

.toast { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, var(--accent-blue), #1D4ED8); color: #fff; padding: 14px 24px; border-radius: 100px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }

.hw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.hw-card { padding: 22px; cursor: pointer; position: relative; }
.hw-card:hover { transform: translateY(-4px); background: var(--glass-card-hover); border-color: var(--glass-border-glow); }

.type-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
.type-card { padding: 14px; text-align: center; border-radius: var(--radius-md); background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); cursor: pointer; transition: 0.2s; font-size: 12px; font-weight: 700; }
.type-card.active { background: rgba(59, 130, 246, 0.25); border-color: var(--accent-blue); color: #fff; }
</style>
</head>

/* INDEXEDDB STORAGE */
let dbInstance = null;
function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open("EverestSaaSDB_v5", 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("store")) db.createObjectStore("store");
    };
    req.onsuccess = (e) => { dbInstance = e.target.result; resolve(); };
    req.onerror = () => resolve();
  });
}

function saveDB() {
  if (!dbInstance) return;
  const tx = dbInstance.transaction("store", "readwrite");
  tx.objectStore("store").put(DB, STORE_KEY);
}

function loadDB() {
  return new Promise((resolve) => {
    if (!dbInstance) { DB = generateInitialData(); return resolve(); }
    const tx = dbInstance.transaction("store", "readonly");
    const req = tx.objectStore("store").get(STORE_KEY);
    req.onsuccess = () => { DB = req.result || generateInitialData(); resolve(); };
    req.onerror = () => { DB = generateInitialData(); resolve(); };
  });
}

let DB = null;
let SESSION = null;
let currentView = 'teacher-dash';
let sidebarCollapsed = false;

function setLoginRole(role){
  document.getElementById('btn-role-student').classList.toggle('active', role === 'student');
  document.getElementById('btn-role-teacher').classList.toggle('active', role === 'teacher');
  document.getElementById('login-username').dataset.role = role;
  populateLoginDropdown(role);
}

function populateLoginDropdown(role){
  const sel = document.getElementById('login-username');
  sel.innerHTML = '';
  DB.users.filter(u => u.role === role).forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.username;
    opt.textContent = `${u.name} (${u.username})`;
    sel.appendChild(opt);
  });
}

function handleLogin(){
  const role = document.getElementById('login-username').dataset.role || 'teacher';
  const uname = document.getElementById('login-username').value;
  const pass = document.getElementById('login-password').value;
  const user = DB.users.find(u => u.username===uname && u.password===pass && u.role===role);
  if(!user){ document.getElementById('login-error').textContent = 'Xato login yoki parol!'; return; }
  SESSION = {userId:user.id, role:user.role};
  try{ localStorage.setItem('everest_saas_session', JSON.stringify(SESSION)); }catch(e){}
  enterApp();
}

function handleLogout(){
  SESSION = null;
  try{ localStorage.removeItem('everest_saas_session'); }catch(e){}
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
  showToast('Tizimdan chiqildi');
}

function currentUser(){ return DB.users.find(u=>u.id===SESSION.userId); }

function enterApp(){
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  currentView = SESSION.role==='teacher' ? 'teacher-dash' : 'student-dash';
  document.getElementById('top-date-display').textContent = new Date().toLocaleDateString('uz-UZ', { month:'short', day:'numeric', year:'numeric' });

  renderMobileNav();
  renderMain();
}

function renderMobileNav(){
  const user = currentUser();
  const nav = document.getElementById('mobile-nav');
  let items = user.role==='teacher' ? 
    [['teacher-dash','home','Dash'],['teacher-hw','book','HW'],['teacher-students','students','Students'],['teacher-progress','chart','Progress']] :
    [['student-dash','home','Home'],['student-hw','book','HW'],['student-progress','chart','Progress']];

  nav.style.display = 'flex';
  nav.innerHTML = items.map(([id,icon,label])=>`
    <button class="${currentView===id?'active':''}" onclick="navigate('${id}')">
      <div style="width:18px;height:18px;">${ICONS[icon]}</div>
      <span>${label}</span>
    </button>
  `).join('');
}

function navigate(view){
  currentView = view;
  renderSidebar();
  renderMobileNav();
  renderMain();
  window.scrollTo(0,0);
}

function renderMain(){
  const el = document.getElementById('main-content');
  if(currentView==='teacher-dash') el.innerHTML = renderTeacherDash();
  else if(currentView==='teacher-hw') el.innerHTML = renderTeacherHW();
  else if(currentView==='teacher-students') el.innerHTML = renderTeacherStudents();
  else if(currentView==='teacher-groups') el.innerHTML = renderTeacherGroups();
  else if(currentView==='teacher-progress') el.innerHTML = renderTeacherProgress();
  else if(currentView==='teacher-vocab') el.innerHTML = renderTeacherVocab();
  else if(currentView==='teacher-materials') el.innerHTML = renderTeacherMaterials();
  else if(currentView==='teacher-settings') el.innerHTML = renderTeacherSettings();
  else if(currentView==='student-dash') el.innerHTML = renderStudentDash();
  else if(currentView==='student-hw') el.innerHTML = renderStudentHW();
  else if(currentView==='student-progress') el.innerHTML = renderStudentProgress();
  else if(currentView==='student-profile') el.innerHTML = renderStudentProfile();
}

  renderMain();
}

  const group = document.getElementById('st-group').value;

  if(!name) { showToast('Name required!'); return; }

  const id = 's' + Date.now();
  DB.users.push({
    id, role:'student', username:'student-' + Math.floor(Math.random()*1000),
    name, studentId:'EV-00' + Math.floor(Math.random()*900+100), group, level:'B1', teacher:'Mr. Aziz', password:'123', streak:0, points:0, avatar:''
  });

  saveDB();
  closeModal();
  showToast('✓ Student added');
  renderMain();
}

function renderStudentDash(){
  const user = currentUser();
  return `

      </div>
      <div class="stat-card glass-panel">
        <div class="stat-card-top"><span class="stat-lbl">Assigned HW</span><div class="stat-icon" style="color:var(--accent-blue);">📚</div></div>
        <div class="stat-val">${DB.homeworks.length}</div>
      </div>
    </div>

    <div class="section-title">My Assigned Homework</div>
    <div class="hw-grid">
      ${DB.homeworks.map(hw => `
        <div class="glass-panel hw-card">
          <div style="font-size:12px; color:var(--accent-blue); font-weight:800;">${hw.type}</div>
          <h3 style="font-family:var(--font-heading); font-size:18px; margin:8px 0; font-weight:800;">${hw.title}</h3>
          <p style="font-size:13px; color:var(--text-muted);">${hw.desc}</p>
          <button class="btn btn-primary" style="width:100%; margin-top:16px; font-size:13px;" onclick="openSubmitHwModal('${hw.id}')">Submit Work</button>
        </div>
      `).join('')}
    </div>
  `;
}

function openSubmitHwModal(hwId){
  const hw = DB.homeworks.find(h=>h.id===hwId);
  const m = document.getElementById('modal-body');
  m.innerHTML = `
    <h2 style="font-family:var(--font-heading); font-weight:800; margin-bottom:8px;">${hw.title}</h2>
    <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">${hw.desc}</p>
    
    <div class="field">
      <label>Your Response / Translation / Text</label>
      <textarea id="sub-content" rows="5" placeholder="Type your answer here..."></textarea>
    </div>

    <div style="display:flex; gap:12px; margin-top:24px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" onclick="submitStudentWork('${hw.id}')">Submit Homework</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('active');
}

function submitStudentWork(hwId){
  const user = currentUser();
  const content = document.getElementById('sub-content').value.trim();
  if(!content) return;

  DB.submissions.push({
    id: 'sub' + Date.now(),
    studentId: user.id,
    hwId,
    content,
    date: '2026-09-21',
    status: 'Pending',
    comment: ''
  });

  user.points += 20;
  saveDB();
  closeModal();
  showToast('✓ Submitted! (+20 pts)');
  renderMain();
}

function renderStudentHW(){ return renderStudentDash(); }

/* UTILS */
function closeModal(){ document.getElementById('modal-bg').classList.remove('active'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function showNotifications(){
  const m = document.getElementById('modal-body');
  m.innerHTML = `
    <h2 style="font-family:var(--font-heading); font-weight:800; margin-bottom:20px;">Notifications</h2>
    ${DB.notifications.map(n => `
      <div style="padding:14px; background:rgba(255,255,255,0.03); border-radius:12px; margin-bottom:10px;">
        <strong>${n.title}</strong>
        <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">${n.desc}</p>
      </div>
    `).join('')}
    <button class="btn btn-secondary" style="width:100%; margin-top:12px;" onclick="closeModal()">Close</button>
  `;
  document.getElementById('modal-bg').classList.add('active');
}

function handleGlobalSearch(query){
  if(!query) return;
  console.log('Searching:', query);
}

function tryRestoreSession(){
  try{
    const raw = localStorage.getItem('everest_saas_session');
    if(raw){ SESSION = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}

// INIT
initDB().then(async () => {
  await loadDB();
  if(tryRestoreSession()) enterApp();
  else populateLoginDropdown('teacher');
});
