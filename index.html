<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVEREST No.1 — English Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#15192B;
  --paper-2:#1E2338;
  --ink:#F3F1E9;
  --ink-soft:#9AA1B8;
  --indigo:#4B4AC4;
  --indigo-deep:#38369A;
  --amber:#E8A33D;
  --amber-soft:#3A2E17;
  --teal:#2E9E82;
  --teal-soft:#122D26;
  --coral:#E4572E;
  --coral-soft:#3A1F16;
  --line:#2B3050;
  --card:#1B2036;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --font-display:'Fraunces', serif;
  --font-body:'Manrope', sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:#07101f;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; margin:0;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
img,svg{display:block; max-width:100%;}
::selection{background:var(--amber-soft);}
a{color:inherit;}

.screen{display:none; min-height:100%;}
.screen.active{display:block;}

/* ============ EVEREST BACKGROUND ============ */
#login-screen.active, #app-screen.active{
  position:relative;
  isolation:isolate;
}
#login-screen.active::before, #app-screen.active::before{
  content:"";
  position:fixed; inset:0; z-index:-2;
  background-image:linear-gradient(180deg, rgba(5,13,29,0.55), rgba(4,10,24,0.85)),
                   url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=3840&auto=format&fit=crop');
  background-size:cover; background-position:center;
  filter:saturate(1.1) contrast(1.05);
}

/* ============ LOGIN ============ */
#login-screen.active{
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh;
  padding:32px 20px;
}
.login-wrap{
  width:100%; max-width:920px; display:grid; grid-template-columns:1.1fr 1fr; gap:0; 
  background:rgba(18,28,59,.82); border-radius:32px; overflow:hidden; 
  box-shadow:0 24px 70px rgba(0,0,0,.5); border:1px solid rgba(177,207,255,.22);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
}
@media (max-width:760px){ .login-wrap{grid-template-columns:1fr;} .login-hero{display:none !important;} }

.login-hero{
  background:linear-gradient(160deg, rgba(37,99,235,.4) 0%, rgba(11,23,54,.8) 100%);
  color:#fff; padding:48px 40px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between;
}
.login-hero .mark{font-family:var(--font-display); font-size:22px; font-weight:600; display:flex; align-items:center; gap:8px;}
.login-hero .headline{font-size:clamp(28px,3.4vw,38px); line-height:1.12; margin-top:28px;}
.login-hero .headline em{font-style:italic; color:#60A5FA;}
.login-hero .foot{font-size:13.5px; color:rgba(255,255,255,.72); line-height:1.5; margin-top:32px;}

.login-form-pane{padding:44px 40px;}
.login-form-pane .eyebrow{color:rgba(221,232,255,.64); font-size:14px;}
.login-form-pane h1{font-size:28px; margin-top:6px; color:#fff;}
.role-toggle{display:flex; background:rgba(255,255,255,.08); border-radius:100px; padding:4px; margin:26px 0 22px;}
.role-toggle button{flex:1; border:none; background:transparent; padding:10px 0; border-radius:100px; font-weight:700; font-size:14px; color:rgba(235,243,255,.6); transition:all .2s ease;}
.role-toggle button.active{background:#2563EB; color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:rgba(220,230,250,.85); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select, .field textarea{width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid rgba(160,190,235,.25); font-size:15px; font-family:var(--font-body); background:rgba(10,18,42,.7); color:#ffffff;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:#60A5FA;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:100px; padding:14px 22px; font-weight:700; font-size:15px; transition:transform .12s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#1D4ED8,#2563EB); color:#fff; width:100%; margin-top:6px; box-shadow:0 8px 18px rgba(37,99,235,.3);}
.btn-primary:hover{opacity:.9;}
.login-error{color:var(--coral); font-size:13.5px; margin-top:10px; min-height:16px;}
.demo-hint{margin-top:22px; padding:14px 16px; background:rgba(255,255,255,.06); border-radius:14px; font-size:12.5px; color:rgba(235,243,255,.7); line-height:1.6;}
.demo-hint b{color:#fff;}

/* ============ APP SHELL ============ */
#app-screen.active{
  padding:16px;
  display:flex;
  min-height:100vh; min-height:100dvh;
}

.sidebar{
  width:270px; flex-shrink:0;
  height:calc(100vh - 32px); height:calc(100dvh - 32px);
  position:sticky; top:16px;
  padding:28px 18px 20px;
  border:1px solid rgba(210,228,255,.25); border-radius:30px;
  background:linear-gradient(180deg,rgba(80,107,166,.35),rgba(8,18,42,.62));
  backdrop-filter:blur(30px) saturate(150%); -webkit-backdrop-filter:blur(30px) saturate(150%);

}
.sidebar .mark{font-family:var(--font-display); font-size:20px; font-weight:600; padding:0 12px 28px; display:flex; align-items:center; gap:9px; color:#fff;}
.sidebar .mark b{color:#73B3FF;}
.nav-item{display:flex; align-items:center; gap:11px; padding:12px 14px; border-radius:17px; color:rgba(239,246,255,.72); font-weight:600; font-size:14.5px; border:none; background:transparent; text-align:left; width:100%; transition:all .2s;}
.nav-item svg{width:20px;height:20px; flex-shrink:0;}
.nav-item.active{background:linear-gradient(135deg,rgba(91,143,255,.46),rgba(123,92,255,.18)); border:1px solid rgba(158,200,255,.32); color:#fff; box-shadow:0 14px 34px rgba(43,102,224,.24);}
.nav-item:hover{color:#fff; background:rgba(255,255,255,.08);}
.sidebar-foot{margin-top:auto; padding-top:18px; border-top:1px solid rgba(255,255,255,.12);}
.user-chip{display:flex; align-items:center; gap:10px; padding:12px; border-radius:20px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14);}
.avatar{width:38px;height:38px;border-radius:50%; background:linear-gradient(135deg,#79B8FF,#5D8FFF); color:#081127; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
.user-chip .u-name{font-size:13.5px; font-weight:700; color:#fff;}
.user-chip .u-role{font-size:11.5px; color:rgba(225,236,255,.58); text-transform:capitalize;}
.logout-btn{margin-top:10px; width:100%; text-align:left; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10); border-radius:16px; color:rgba(235,243,255,.7); font-size:13px; font-weight:600; padding:10px 12px; display:flex; align-items:center; gap:8px;}
.logout-btn:hover{color:#fff; background:rgba(255,255,255,.12);}

.main{flex:1; min-width:0; padding:26px 28px 50px; overflow:auto;}
@media (max-width:860px){
  .sidebar{position:fixed; left:10px; right:10px; bottom:10px; top:auto; width:auto; height:auto; flex-direction:row; align-items:center; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); z-index:50; justify-content:space-around; border-radius:24px;}

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:16px; flex-wrap:wrap;}
.topbar h1{font-size:clamp(26px,3vw,36px); color:#fff;}
.topbar .sub{color:rgba(221,232,255,.64); font-size:14.5px; margin-top:4px;}

/* ============ DASHBOARD & CARDS ============ */
.progress-hero{
  background:linear-gradient(135deg,rgba(52,91,166,.46),rgba(27,37,83,.58));
  border:1px solid rgba(210,228,255,.22); border-radius:26px; padding:26px 28px; color:#fff; margin-bottom:28px;
  display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); box-shadow:0 20px 50px rgba(0,0,0,.3);
}
.progress-hero .ph-text .greet{font-size:14.5px; color:rgba(224,235,255,.68); font-weight:600;}
.progress-hero .ph-text h2{font-size:clamp(20px,2.6vw,26px); margin-top:4px;}
.ring-wrap{position:relative; width:104px; height:104px; flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}

.ring-label .d{font-size:10px; color:rgba(255,255,255,.7); font-weight:700;}

.hw-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px;}
.hw-card{
  background:linear-gradient(145deg,rgba(31,52,100,.64),rgba(11,23,53,.70));
  border:1px solid rgba(177,207,255,.22); border-radius:24px; padding:22px;

}
.hw-card:hover{transform:translateY(-3px); border-color:rgba(210,230,255,.4);}

.hw-card .hw-sub{font-size:13.5px; color:rgba(222,233,253,.68);}
.status-tag{position:absolute; top:18px; right:18px; font-size:11px; font-weight:800; padding:4px 10px; border-radius:100px; display:flex; align-items:center; gap:5px;}
.status-not{background:rgba(244,80,38,.2); color:#FF7C54;}
.status-done{background:rgba(32,199,157,.2); color:#42D9B0;}

/* ============ DETAIL PAGE & BOOK STYLING ============ */
.detail-wrap{max-width:850px; background:rgba(18,28,59,.80); border:1px solid rgba(177,207,255,.22); border-radius:26px; padding:28px; backdrop-filter:blur(22px);}
.back-btn{display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; font-weight:700; font-size:14px; padding:8px 16px; border-radius:100px; margin-bottom:18px;}
.detail-block{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius-md); padding:22px 24px; margin-bottom:16px;}
.detail-block h4{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:#60A5FA; font-weight:800; margin-bottom:12px;}

.book-container{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-top:14px;
}
.book-page{
  position:relative; background:#121829; border-radius:8px 16px 16px 8px; overflow:hidden;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:-5px 5px 15px rgba(0,0,0,0.5), inset 12px 0 15px -8px rgba(0,0,0,0.7);
  transition:transform 0.2s ease, box-shadow 0.2s ease; aspect-ratio:3/4; cursor:pointer;
}
.book-page:hover{ transform:translateY(-5px) rotate(1deg); box-shadow:-8px 12px 20px rgba(0,0,0,0.6); }
.book-page img{ width:100%; height:100%; object-fit:cover; }
.book-page .page-badge{
  position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.7); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:100px; border:1px solid rgba(255,255,255,0.2);
}

/* ============ TEACHER & TABLES ============ */
.teacher-card{background:rgba(18,28,59,.80); border:1px solid rgba(177,207,255,.22); border-radius:24px; padding:24px; backdrop-filter:blur(22px);}
.table-wrap{background:rgba(10,18,42,.6); border:1px solid rgba(255,255,255,.1); border-radius:18px; overflow:hidden;}
.t-row{display:grid; grid-template-columns:2fr 1.2fr auto; gap:10px; align-items:center; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px;}
.t-row.head{background:rgba(255,255,255,.05); font-weight:800; font-size:11.5px; text-transform:uppercase; color:rgba(220,230,250,.6);}
.icon-btn{background:rgba(255,255,255,.08); border:none; width:34px; height:34px; border-radius:100px; display:inline-flex; align-items:center; justify-content:center; color:#fff;}

/* ============ MODAL ============ */
.modal-bg{
  position:fixed; inset:0; 
  background:rgba(5,11,24,.82); 
  display:none; align-items:center; justify-content:center; 
  z-index:1000; padding:20px; 
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.modal-bg.active{display:flex;}
.modal{
  background:#121829; 
  border:1.5px solid rgba(177,207,255,.3); 
  border-radius:28px; padding:32px; 
  width:100%; max-width:560px; max-height:90vh; 
  overflow-y:auto; color:#ffffff; 
  box-shadow:0 24px 70px rgba(0,0,0,.8);
}
.modal h3{
  font-size:24px; margin-bottom:20px; color:#ffffff; 
  border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px;
}
.modal-actions{display:flex; gap:12px; margin-top:24px;}
.btn-ghost{background:rgba(255,255,255,.1); color:#fff; border:none; border-radius:100px; padding:12px 22px; font-weight:700; flex:1;}
.btn-ghost:hover{background:rgba(255,255,255,.18);}

.preview-grid{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.preview-thumb{ width:60px; height:60px; border-radius:8px; object-fit:cover; border:1px solid rgba(255,255,255,0.2); }

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#2563EB; color:#fff; padding:12px 24px; border-radius:100px; font-size:14px; font-weight:700; opacity:0; transition:all .25s ease; z-index:2000; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen" class="screen active">
  <div class="login-wrap">
    <div class="login-hero">
      <div class="mark">
        <svg viewBox="0 0 48 38" width="32" height="28"><path d="M2 34 16 11l7 11 6-9 17 21H2Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        EVEREST <b style="color:#60A5FA;">No.1</b>
      </div>
      <div>
        <div class="headline">Your homework,<br>made <em>obvious</em>.</div>
        <p style="margin-top:14px; color:rgba(255,255,255,.75); font-size:15px; line-height:1.6;">Barcha o'quvchilar va o'qituvchilar uchun yagona platforma.</p>
      </div>
      <div class="foot">EVEREST Learning Center System</div>
    </div>
    <div class="login-form-pane">
      <div class="eyebrow">Welcome back</div>
      <h1>Sign in to continue</h1>
      <div class="role-toggle">
        <button type="button" class="active" data-role="student" onclick="setLoginRole('student')">Student</button>
        <button type="button" data-role="teacher" onclick="setLoginRole('teacher')">Teacher</button>

        <label>Password</label>
        <input id="login-password" type="password" value="123" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="handleLogin()">Sign in</button>
      <div class="login-error" id="login-error"></div>

        <b>Default Password:</b> 123
      </div>
    </div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="app-screen" class="screen">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main-content"></main>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'everest_hw_db_v4';

const ICONS = {
  book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5C4 3.67 4.67 3 5.5 3H12v16H5.5C4.67 19 4 19.67 4 20.5V4.5Z"/><path d="M20 4.5c0-.83-.67-1.5-1.5-1.5H12v16h6.5c.83 0 1.5.67 1.5 1.5V4.5Z"/></svg>`,
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg>`,
  chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m14.5 4.5 5 5L8 21H3v-5L14.5 4.5Z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5L19 7"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9M16 15l4-3-4-3M20 12H9"/></svg>`
};

function generateUsers() {
  const users = [
    {id:'t1', role:'teacher', username:'teacher-1', password:'123'},
    {id:'t2', role:'teacher', username:'teacher-2', password:'123'}
  ];
  for(let i = 1; i <= 25; i++) {
    users.push({ id: 's' + i, role: 'student', username: 'student-' + i, password: '123' });
  }
  return users;
}

function defaultData(){
  return {
    users: generateUsers(),
    homeworks: [
      {
        id:'hw1', icon:'book', title:'Essential 2 (Unit 27-28)', figure:'27 → 28 Units',
        sub:'Essential English Grammar', due:'2026-09-28',
        whatToDo:'Essential 2 kitobidagi 27 va 28-unitlarni bajarib kelish.',
        images:[
          'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=600&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=600&auto=format&fit=crop'
        ],
        audioUrl:''
      }
    ],
    progress: {}
  };
}

/* ================= INDEXEDDB STORAGE (MA'LUMOT O'CHMAYDI) ================= */
let dbInstance = null;
function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open("EverestHomeworkDB", 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("store")) {
        db.createObjectStore("store");
      }
    };
    req.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve();
    };
    req.onerror = () => resolve();
  });
}

function saveDB() {
  if (!dbInstance) return;
  const tx = dbInstance.transaction("store", "readwrite");
  const store = tx.objectStore("store");
  store.put(DB, STORE_KEY);
}

function loadDB() {
  return new Promise((resolve) => {
    if (!dbInstance) { DB = defaultData(); return resolve(); }
    const tx = dbInstance.transaction("store", "readonly");
    const store = tx.objectStore("store");
    const req = store.get(STORE_KEY);
    req.onsuccess = () => {
      DB = req.result || defaultData();
      resolve();
    };
    req.onerror = () => {
      DB = defaultData();
      resolve();
    };
  });
}

let DB = null;
let tempImages = [];
let SESSION = null;
let currentView = 'dashboard';
let currentHwId = null;

function populateLoginDropdown(role){
  const sel = document.getElementById('login-username');
  sel.innerHTML = '';
  DB.users.filter(u => u.role === role).forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.username;
    opt.textContent = u.username;
    sel.appendChild(opt);
  });
}

function setLoginRole(role){
  document.querySelectorAll('.role-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
  document.getElementById('login-username').dataset.role = role;
  populateLoginDropdown(role);
}

function handleLogin(){
  const role = document.getElementById('login-username').dataset.role || 'student';
  const uname = document.getElementById('login-username').value;
  const pass = document.getElementById('login-password').value;
  const user = DB.users.find(u => u.username===uname && u.password===pass && u.role===role);
  if(!user){ document.getElementById('login-error').textContent = 'Parol noto\'g\'ri!'; return; }
  SESSION = {userId:user.id, role:user.role};
  try{ localStorage.setItem('everest_session', JSON.stringify(SESSION)); }catch(e){}
  enterApp();
}

function handleLogout(){
  SESSION = null;
  try{ localStorage.removeItem('everest_session'); }catch(e){}
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
}

function currentUser(){ return DB.users.find(u=>u.id===SESSION.userId); }

function enterApp(){
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  currentView = SESSION.role==='teacher' ? 'teacher-home' : 'dashboard';
  renderSidebar();
  renderMain();
}

function renderSidebar(){
  const user = currentUser();
  const sb = document.getElementById('sidebar');
  let navItems = user.role==='student' ? 
    [['dashboard','home','Homework'],['progress','chart','Progress']] :
    [['teacher-home','home','Teacher Panel'],['teacher-progress','chart','Class Progress']];

  sb.innerHTML = `
    <div class="mark">
      <svg viewBox="0 0 48 38" width="30" height="26"><path d="M2 34 16 11l7 11 6-9 17 21H2Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <span>EVEREST <b>No.1</b></span>
    </div>
    ${navItems.map(([id,icon,label])=>`
      <button class="nav-item ${currentView===id?'active':''}" onclick="navigate('${id}')">
        ${ICONS[icon]}<span>${label}</span>
      </button>
    `).join('')}
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar">${user.username.substr(0,2).toUpperCase()}</div>
        <div>
          <div class="u-name">${user.username}</div>
          <div class="u-role">${user.role}</div>
        </div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">${ICONS.logout} Sign out</button>
    </div>
  `;
}

function navigate(view, hwId){
  currentView = view;
  currentHwId = hwId || null;
  renderSidebar();
  renderMain();
  window.scrollTo(0,0);
}

function renderMain(){
  const el = document.getElementById('main-content');
  if(currentView==='dashboard') el.innerHTML = renderStudentDashboard();
  else if(currentView==='detail') el.innerHTML = renderDetailPage(currentHwId);
  else if(currentView==='progress') el.innerHTML = renderStudentProgress();
  else if(currentView==='teacher-home') el.innerHTML = renderTeacherHome();
  else if(currentView==='teacher-progress') el.innerHTML = renderTeacherProgress();
}

/* ================= DASHBOARD & DETAILS ================= */
function getProgress(userId, hwId){
  DB.progress[userId] = DB.progress[userId] || {};
  return DB.progress[userId][hwId] || {status:'not-started'};
}

function setProgress(userId, hwId, patch){
  DB.progress[userId] = DB.progress[userId] || {};
  DB.progress[userId][hwId] = Object.assign({}, DB.progress[userId][hwId]||{}, patch);
  saveDB();
}

function renderStudentDashboard(){
  const user = currentUser();
  const hws = DB.homeworks;
  const completed = hws.filter(hw => (getProgress(user.id, hw.id).status==='done')).length;
  const pct = hws.length ? Math.round((completed/hws.length)*100) : 0;

  return `
    <div class="topbar">
      <div>
        <h1>Welcome, ${user.username}</h1>
        <div class="sub">EVEREST System</div>
      </div>
    </div>

    <div class="progress-hero">
      <div class="ph-text">
        <div class="greet">Your Overall Progress</div>
        <h2>${completed} of ${hws.length} Homework Completed</h2>
      </div>
      <div class="ring-wrap">
        <svg width="104" height="104">
          <circle cx="52" cy="52" r="42" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
          <circle cx="52" cy="52" r="42" fill="none" stroke="#60A5FA" stroke-width="8" 
                  stroke-dasharray="263" stroke-dashoffset="${263 - (263*pct)/100}"/>
        </svg>
        <div class="ring-label">
          <span class="n">${pct}%</span>
          <span class="d">DONE</span>
        </div>
      </div>
    </div>

    <div class="hw-grid">
      ${hws.map(hw => {
        const isDone = getProgress(user.id, hw.id).status === 'done';
        return `
          <div class="hw-card" onclick="navigate('detail', '${hw.id}')">
            <div class="status-tag ${isDone?'status-done':'status-not'}">
              ${isDone?'Completed':'Pending'}
            </div>
            <h3>${hw.title}</h3>
            <div class="hw-sub">${hw.figure}</div>
            <div style="font-size:12px; color:rgba(255,255,255,.6); margin-top:auto;">Due: ${hw.due}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderDetailPage(hwId){
  const user = currentUser();
  const hw = DB.homeworks.find(h=>h.id===hwId);
  const isDone = getProgress(user.id, hwId).status === 'done';
  const imgs = hw.images || (hw.imgUrl ? [hw.imgUrl] : []);

  return `
    <div class="detail-wrap">
      <button class="back-btn" onclick="navigate('dashboard')">← Back</button>
      <h1>${hw.title}</h1>
      <div style="color:#60A5FA; margin-bottom:18px; font-weight:700;">${hw.figure}</div>

      <div class="detail-block">
        <h4>Task Instructions</h4>
        <p>${hw.whatToDo}</p>
      </div>

      ${(imgs.length > 0 || hw.audioUrl) ? `
        <div class="detail-block">
          <h4>Kitob Varaqlari / Resurslar (${imgs.length} ta rasm)</h4>${imgs.length > 0 ? `
            <div class="book-container">
              ${imgs.map((src, i) => `
                <div class="book-page" onclick="window.open('${src}', '_blank')">
                  <img src="${src}" alt="Page ${i+1}">
                  <div class="page-badge">Page ${i+1}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
          ${hw.audioUrl ? `<audio controls src="${hw.audioUrl}" style="width:100%; margin-top:16px;"></audio>` : ''}
        </div>
      ` : ''}

      <button class="btn btn-primary" onclick="toggleTaskDone('${hw.id}')">
        ${isDone ? 'Mark as Undone' : 'Mark Task as Completed'}
      </button>
    </div>
  `;
}

function toggleTaskDone(hwId){
  const user = currentUser();
  const p = getProgress(user.id, hwId);
  setProgress(user.id, hwId, {status: p.status === 'done' ? 'not-started' : 'done'});
  showToast('Status Updated!');
  renderMain();
}

function renderStudentProgress(){
  const user = currentUser();
  return `
    <div class="topbar"><h1>My Progress History</h1></div>
    <div class="teacher-card">
      ${DB.homeworks.map(hw => `
        <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.1);">
          <div><strong>${hw.title}</strong></div>
          <div style="color:${getProgress(user.id, hw.id).status==='done'?'#42D9B0':'#FF7C54'}">
            ${getProgress(user.id, hw.id).status==='done'?'Completed':'Pending'}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ================= TEACHER CONTROLS ================= */
function renderTeacherHome(){
  return `
    <div class="topbar">
      <div><h1>Teacher Control Center</h1></div>
      <button class="btn btn-primary" style="width:auto;" onclick="openHwModal()">${ICONS.plus} New Homework</button>
    </div>

    <div class="table-wrap">
      <div class="t-row head">
        <div>Title & Info</div>
        <div>Media</div>
        <div>Actions</div>
      </div>
      ${DB.homeworks.map(hw => {
        const count = hw.images ? hw.images.length : (hw.imgUrl ? 1 : 0);
        return `
        <div class="t-row">
          <div><strong>${hw.title}</strong><br><small style="color:rgba(255,255,255,.6);">${hw.figure}</small></div>
          <div>${count > 0 ? `📖 ${count} page(s)` : ''} ${hw.audioUrl?'🎵':''}</div>
          <div>
            <button class="icon-btn" onclick="openHwModal('${hw.id}')">${ICONS.edit}</button>
            <button class="icon-btn" onclick="deleteHw('${hw.id}')">${ICONS.trash}</button>
          </div>
        </div>
      `}).join('')}
    </div>
  `;
}

function openHwModal(hwId = null){
  const hw = hwId ? DB.homeworks.find(h=>h.id===hwId) : null;
  tempImages = hw ? (hw.images || (hw.imgUrl ? [hw.imgUrl] : [])) : [];

  const m = document.getElementById('modal-body');
  m.innerHTML = `
    <h3>${hw ? 'Edit Homework' : 'Create Homework'}</h3>
    <div class="field">
      <label>Title</label>
      <input id="hw-title" type="text" value="${hw?hw.title:''}" placeholder="e.g. Grammar Practice">
    </div>
    <div class="field">
      <label>Headline Figure</label>
      <input id="hw-figure" type="text" value="${hw?hw.figure:''}" placeholder="e.g. 12 - 15 Units">
    </div>
    <div class="field">
      <label>Kitob sahifalari rasmi (Maksimal 4 ta):</label>
      <input type="file" accept="image/*" multiple onchange="handleMultipleFiles(this)">
      <div class="preview-grid" id="preview-grid">
        ${renderPreviewThumbs()}
      </div>
    </div>
    <div class="field">
      <label>Audio Practice File (URL / Upload)</label>
      <input id="hw-audio" type="text" value="${hw?(hw.audioUrl||''):''}">
      <input type="file" accept="audio/*" style="margin-top:6px;" onchange="handleAudioUpload(this)">
    </div>
    <div class="field">
      <label>What To Do</label>
      <textarea id="hw-desc" rows="3">${hw?hw.whatToDo:''}</textarea>
    </div>
    <div class="field">
      <label>Due Date</label>
      <input id="hw-due" type="date" value="${hw?hw.due:'2026-09-30'}">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="width:auto;" onclick="saveHw('${hw?hw.id:''}')">Save Homework</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('active');
}

function renderPreviewThumbs(){
  return tempImages.map((src, i) => `<img src="${src}" class="preview-thumb" title="Page ${i+1}">`).join('');
}

function compressImage(file, maxWidth = 1000) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) {
          h = Math.round((h * maxWidth) / w);
          w = maxWidth;
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
    };
  });
}

async function handleMultipleFiles(inputEl){
  const files = Array.from(inputEl.files);
  if(files.length + tempImages.length > 4){
    showToast('Maksimum 4 ta rasm yuklash mumkin!');
  }
  const allowedFiles = files.slice(0, 4 - tempImages.length);
  for(let file of allowedFiles) {
    const compressedBase64 = await compressImage(file);
    tempImages.push(compressedBase64);
  }
  document.getElementById('preview-grid').innerHTML = renderPreviewThumbs();
  showToast('Rasmlar saqlandi!');
}

function handleAudioUpload(inputEl){
  const file = inputEl.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      document.getElementById('hw-audio').value = e.target.result;
      showToast('Audio fayl yuklandi!');
    };
    reader.readAsDataURL(file);
  }
}

function closeModal(){ document.getElementById('modal-bg').classList.remove('active'); }

function saveHw(hwId){
  const title = document.getElementById('hw-title').value;
  const figure = document.getElementById('hw-figure').value;
  const audioUrl = document.getElementById('hw-audio').value;
  const desc = document.getElementById('hw-desc').value;
  const due = document.getElementById('hw-due').value;

  if(!title){ showToast('Please enter title'); return; }

  if(hwId){
    const hw = DB.homeworks.find(h=>h.id===hwId);
    Object.assign(hw, {title, figure, images: tempImages, audioUrl, whatToDo:desc, due});
  } else {
    DB.homeworks.push({
      id:'hw_'+Date.now(), icon:'book', title, figure, due, whatToDo:desc,
      instructions:['Follow instructions.'], images: tempImages, audioUrl
    });
  }
  saveDB(); closeModal(); showToast('Saved Successfully!'); renderMain();
}

function deleteHw(hwId){
  if(confirm('Delete assignment?')){
    DB.homeworks = DB.homeworks.filter(h=>h.id!==hwId);
    saveDB(); renderMain();
  }
}

function renderTeacherProgress(){
  return `
    <div class="topbar"><h1>Class Progress</h1></div>
    <div class="table-wrap">
      <div class="t-row head" style="grid-template-columns: 2fr 1fr;">
        <div>Student Login</div><div>Completed</div>
      </div>
      ${DB.users.filter(u=>u.role==='student').map(s => `
        <div class="t-row" style="grid-template-columns: 2fr 1fr;">
          <div><strong>${s.username}</strong></div>
          <div>${DB.homeworks.filter(hw => getProgress(s.id, hw.id).status==='done').length} /${DB.homeworks.length}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function tryRestoreSession(){
  try{
    const raw = localStorage.getItem('everest_session');
    if(raw){ SESSION = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}

// APP INITIALIZATION
initDB().then(async () => {
  await loadDB();
  if(tryRestoreSession()) enterApp();
  else populateLoginDropdown('student');
});
</script>
